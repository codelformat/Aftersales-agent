services:
  mysql:
    image: mysql:8
    container_name: aftersales-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: aftersales-root
      MYSQL_DATABASE: aftersales
      MYSQL_USER: aftersales
      MYSQL_PASSWORD: aftersales
    volumes:
      - aftersales-mysql-data:/var/lib/mysql
      - ./db/initdb/00-test-db.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -paftersales-root --silent"]
      interval: 5s
      retries: 20
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci

volumes:
  aftersales-mysql-data:
    name: aftersales-mysql-data
