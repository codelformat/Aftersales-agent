<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>示例商城 · 编造个案台账</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --page: #f4f6fa;
      --surface: #ffffff;
      --assistant: #f0f2f5;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --error: #c62828;
      --on-primary: #ffffff;
      --focus: #93b4ff;
      --shadow: #1f29370d;
      --tool-pending-bg: #e8edf8;
      --tool-pending-text: #46618f;
      --tool-success-bg: #e4f3e8;
      --tool-success-text: #28733e;
      --tool-failure-bg: #fce8e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    [hidden] { display: none !important; }
    .ledger {
      width: min(1200px, calc(100% - 48px));
      margin: 28px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 0 40px var(--shadow);
      overflow: hidden;
    }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 28px; }
    h1 { margin: 0; font-size: 19px; font-weight: 650; }
    .subtext { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
    .chat-link { color: var(--primary); font-size: 14px; text-decoration: none; flex-shrink: 0; }
    .chat-link:hover { text-decoration: underline; }
    .admin-nav { display: flex; flex-wrap: wrap; gap: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 0 28px 20px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .button {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }
    .button:hover:enabled { background: var(--assistant); }
    .filter[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--tool-pending-bg); }
    .primary { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
    .primary:hover:enabled { background: var(--primary-hover); }
    .summary { margin-left: auto; color: var(--muted); font-size: 13px; }
    .notice { margin: 0; padding: 24px 28px; border-top: 1px solid var(--border); color: var(--muted); }
    .notice.error, .error { color: var(--error); }
    .notice .button { margin-left: 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 900px; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; vertical-align: top; padding: 16px 18px; border-top: 1px solid var(--border); }
    th { color: var(--muted); background: var(--page); font-size: 12px; font-weight: 600; white-space: nowrap; }
    .case-row { cursor: pointer; }
    .case-row:hover, .case-row.expanded { background: #f8faff; }
    .query-cell { width: 34%; min-width: 230px; }
    .expand {
      width: 100%; padding: 0; border: 0; background: transparent; color: var(--text);
      text-align: left; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .expand::before { content: '▸'; color: var(--muted); margin-right: 8px; }
    .expand[aria-expanded="true"]::before { content: '▾'; }
    .nowrap { white-space: nowrap; }
    .status { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; background: var(--assistant); color: var(--muted); }
    .status.open { background: var(--tool-pending-bg); color: var(--tool-pending-text); }
    .status.resolved { background: var(--tool-success-bg); color: var(--tool-success-text); }
    .recurrence { display: inline-block; margin: 6px 0 0 6px; padding: 3px 7px; border-radius: 6px; color: var(--error); background: var(--tool-failure-bg); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; min-width: 105px; }
    .actions .button { padding: 5px 9px; font-size: 12px; white-space: nowrap; }
    .detail-cell { padding: 20px 28px 24px; background: #fafbfe; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    h2 { margin: 0; font-size: 17px; }
    h3 { margin: 0 0 10px; font-size: 14px; font-weight: 650; }
    .prose { margin: 0; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .evidence-heading { margin-top: 24px; }
    .evidence-list { display: grid; gap: 12px; }
    .evidence { padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .evidence.cited { border-color: var(--primary); background: #eff5ff; }
    .evidence-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .evidence-title strong { overflow-wrap: anywhere; }
    .cited-label { color: var(--primary); font-size: 12px; }
    .resolution-history { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .resolve-dialog {
      width: min(520px, calc(100% - 32px)); max-height: 85vh; max-height: 85dvh;
      padding: 24px; border: 1px solid var(--border); border-radius: 16px;
      background: var(--surface); color: var(--text); box-shadow: 0 12px 40px #1f293726;
    }
    .resolve-dialog::backdrop { background: #1f29374d; }
    .resolve-dialog label { display: block; margin: 20px 0 9px; font-size: 14px; }
    textarea { width: 100%; min-height: 130px; resize: vertical; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); line-height: 1.5; }
    .form-meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .form-error { margin: 12px 0 0; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    @media (max-width: 600px) {
      .ledger { width: 100%; margin: 0; min-height: 100vh; border: 0; border-radius: 0; }
      .header { padding: 20px 16px; }
      h1 { font-size: 17px; }
      .toolbar { padding: 0 16px 16px; }
      .summary { width: 100%; margin-left: 0; }
      .detail-grid { grid-template-columns: 1fr; gap: 20px; }
      .detail-cell { padding: 20px 16px; }
      .notice { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <main class="ledger">
    <header class="header">
      <div>
        <h1>编造个案台账</h1>
        <p class="subtext">点击问题所在行，查看答案、裁判理由和证据。</p>
      </div>
      <nav class="admin-nav" aria-label="管理页面">
        <a class="chat-link" href="/admin/faith-cases" aria-current="page">编造台账</a>
        <a class="chat-link" href="/admin/review-queue">待审队列</a>
        <a class="chat-link" href="/admin/eval-runs">评估趋势</a>
        <a class="chat-link" href="/">返回聊天</a>
      </nav>
    </header>
    <div class="toolbar">
      <div id="filters" class="filters" role="group" aria-label="按状态筛选">
        <button class="button filter" type="button" data-status="" aria-pressed="true">全部</button>
        <button class="button filter" type="button" data-status="未解决" aria-pressed="false">未解决</button>
        <button class="button filter" type="button" data-status="已解决" aria-pressed="false">已解决</button>
        <button class="button filter" type="button" data-status="无需解决" aria-pressed="false">无需解决</button>
      </div>
      <span id="summary" class="summary" role="status"></span>
    </div>
    <div id="notice" class="notice" role="status" hidden>
      <span id="notice-text"></span>
      <button id="retry" class="button" type="button" hidden>重新加载</button>
    </div>
    <div class="table-wrap" aria-busy="true" id="table-wrap">
      <table aria-label="编造个案列表">
        <thead><tr><th scope="col">题号</th><th scope="col">桶</th><th scope="col">问题</th><th scope="col">出现次数</th><th scope="col">最后出现时间</th><th scope="col">状态</th><th scope="col">处置</th></tr></thead>
        <tbody id="cases"></tbody>
      </table>
    </div>
  </main>
  <dialog id="resolve-dialog" class="resolve-dialog" aria-labelledby="resolve-title">
    <form id="resolve-form" novalidate>
      <h2 id="resolve-title"></h2>
      <p id="resolve-case" class="subtext"></p>
      <label for="resolution">处置说明</label>
      <textarea id="resolution" rows="5" required aria-describedby="resolution-hint resolution-count resolve-error" placeholder="请说明处置方式或无需解决的原因…"></textarea>
      <div class="form-meta"><span id="resolution-hint">必填，去除首尾空白后 1–300 字</span><span id="resolution-count">0 / 300</span></div>
      <p id="resolve-error" class="form-error error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="resolve-cancel" class="button" type="button">取消</button>
        <button id="resolve-submit" class="button primary" type="submit">确认提交</button>
      </div>
    </form>
  </dialog>
  <script>
    const casesBody = document.getElementById('cases');
    const filters = document.getElementById('filters');
    const summary = document.getElementById('summary');
    const notice = document.getElementById('notice');
    const noticeText = document.getElementById('notice-text');
    const retry = document.getElementById('retry');
    const tableWrap = document.getElementById('table-wrap');
    const dialog = document.getElementById('resolve-dialog');
    const resolution = document.getElementById('resolution');
    const resolutionCount = document.getElementById('resolution-count');
    const resolveError = document.getElementById('resolve-error');
    const submitButton = document.getElementById('resolve-submit');
    const cancelButton = document.getElementById('resolve-cancel');
    let cases = [];
    let selectedStatus = '';
    let listRequest = 0;
    let listController = null;
    let pendingCase = null;
    let saving = false;
    const expanded = new Set();

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString('zh-CN', { hour12: false });
    }

    async function readResponse(response) {
      let body;
      try { body = await response.json(); } catch { /* Fall back to the HTTP status. */ }
      if (!response.ok) {
        const detail = body?.detail;
        let message = typeof detail === 'string' ? detail : detail?.message;
        if (Array.isArray(detail)) {
          message = detail.map(item => {
            const field = Array.isArray(item.loc) ? item.loc.filter(part => part !== 'body').join('.') : '';
            return `${field ? field + '：' : ''}${item.msg || JSON.stringify(item)}`;
          }).join('\n');
        }
        throw new Error(message || body?.message || `请求失败（HTTP ${response.status}）`);
      }
      if (body === undefined) throw new Error('无法读取接口数据，请重新加载');
      return body;
    }

    function showNotice(text, isError = false) {
      notice.hidden = !text;
      notice.className = isError ? 'notice error' : 'notice';
      notice.setAttribute('role', isError ? 'alert' : 'status');
      noticeText.textContent = text;
      retry.hidden = !isError;
    }

    function detailSection(title, text) {
      const section = element('section');
      section.append(element('h3', '', title), element('p', 'prose', text || '—'));
      return section;
    }

    function renderDetails(item) {
      const cell = element('td', 'detail-cell');
      cell.colSpan = 7;
      const grid = element('div', 'detail-grid');
      grid.append(detailSection('答案原文', item.answer), detailSection('裁判理由', item.reason));
      cell.append(grid, element('h3', 'evidence-heading', '证据全集'));
      const evidenceList = element('div', 'evidence-list');
      const cited = new Set(item.cited || []);
      for (const evidence of item.citations || []) {
        const isCited = cited.has(evidence.n);
        const card = element('article', isCited ? 'evidence cited' : 'evidence');
        const heading = element('div', 'evidence-title');
        heading.append(element('strong', '', `[${evidence.n}] ${evidence.section_path || '知识库原文'}`));
        if (isCited) heading.append(element('span', 'cited-label', '已引用'));
        card.append(heading, element('p', 'prose', `问：${evidence.question ?? ''}\n答：${evidence.answer ?? ''}`));
        evidenceList.append(card);
      }
      if (!evidenceList.childElementCount) evidenceList.append(element('p', 'subtext', '暂无证据'));
      cell.append(evidenceList);
      if (item.resolution || item.resolved_at) {
        const history = detailSection('处置记录', item.resolution || '—');
        history.className = 'resolution-history';
        if (item.resolved_at) history.append(element('p', 'subtext', `处置时间：${formatDate(item.resolved_at)}`));
        cell.append(history);
      }
      return cell;
    }

    function renderCases() {
      const fragment = document.createDocumentFragment();
      for (const item of cases) {
        const row = element('tr', 'case-row');
        const detailRow = element('tr');
        const isExpanded = expanded.has(item.id);
        row.classList.toggle('expanded', isExpanded);
        detailRow.id = `case-detail-${item.id}`;
        detailRow.hidden = !isExpanded;
        detailRow.append(renderDetails(item));
        const queryCell = element('td', 'query-cell');
        const expandButton = element('button', 'expand', item.query);
        expandButton.type = 'button';
        expandButton.setAttribute('aria-expanded', String(isExpanded));
        expandButton.setAttribute('aria-controls', detailRow.id);
        queryCell.append(expandButton);
        const statusCell = element('td');
        const statusClass = item.status === '未解决' ? 'open' : item.status === '已解决' ? 'resolved' : '';
        statusCell.append(element('span', `status ${statusClass}`, item.status));
        if (item.resolved_at && item.status === '未解决') statusCell.append(element('span', 'recurrence', '复发'));
        const actionCell = element('td');
        const actions = element('div', 'actions');
        for (const status of ['已解决', '无需解决']) {
          const button = element('button', 'button', status);
          button.type = 'button';
          button.setAttribute('aria-label', `将题号 ${item.eval_id} 标记为${status}`);
          button.addEventListener('click', event => {
            event.stopPropagation();
            openResolve(item, status);
          });
          actions.append(button);
        }
        actionCell.append(actions);
        row.append(element('td', '', item.eval_id), element('td', '', item.bucket), queryCell,
          element('td', 'nowrap', item.seen_count), element('td', 'nowrap', formatDate(item.last_seen_at)), statusCell, actionCell);
        row.addEventListener('click', () => {
          const open = detailRow.hidden;
          detailRow.hidden = !open;
          row.classList.toggle('expanded', open);
          expandButton.setAttribute('aria-expanded', String(open));
          if (open) expanded.add(item.id); else expanded.delete(item.id);
        });
        fragment.append(row, detailRow);
      }
      casesBody.replaceChildren(fragment);
      summary.textContent = `共 ${cases.length} 个案`;
      showNotice(cases.length ? '' : '当前筛选下暂无个案');
    }

    async function loadCases() {
      const request = ++listRequest;
      if (listController) listController.abort();
      listController = new AbortController();
      casesBody.replaceChildren();
      summary.textContent = '正在加载…';
      tableWrap.setAttribute('aria-busy', 'true');
      showNotice('正在加载个案…');
      try {
        const query = selectedStatus ? '?' + new URLSearchParams({ status: selectedStatus }) : '';
        const response = await fetch('/api/faith-cases' + query, { signal: listController.signal });
        const data = await readResponse(response);
        if (request !== listRequest) return;
        if (!Array.isArray(data)) throw new Error('个案列表格式错误');
        cases = data;
        renderCases();
      } catch (error) {
        if (request !== listRequest) return;
        cases = [];
        summary.textContent = '加载失败';
        showNotice(error instanceof TypeError ? '网络连接失败，请检查网络后重试' : error.message, true);
      } finally {
        if (request === listRequest) tableWrap.setAttribute('aria-busy', 'false');
      }
    }

    function updateResolutionCount() {
      const count = Array.from(resolution.value.trim()).length;
      resolutionCount.textContent = `${count} / 300`;
      resolutionCount.classList.toggle('error', count > 300);
      return count;
    }

    function openResolve(item, status) {
      pendingCase = { id: item.id, status };
      document.getElementById('resolve-title').textContent = `标记为${status}`;
      document.getElementById('resolve-case').textContent = `题号：${item.eval_id}`;
      resolution.value = '';
      resolution.removeAttribute('aria-invalid');
      resolveError.hidden = true;
      resolveError.textContent = '';
      updateResolutionCount();
      dialog.showModal();
      resolution.focus();
    }

    function setSaving(value) {
      saving = value;
      submitButton.disabled = value;
      cancelButton.disabled = value;
      resolution.disabled = value;
      submitButton.textContent = value ? '提交中…' : '确认提交';
    }

    filters.addEventListener('click', event => {
      const button = event.target.closest('button[data-status]');
      if (!button || button.dataset.status === selectedStatus) return;
      selectedStatus = button.dataset.status;
      for (const filter of filters.querySelectorAll('button')) {
        filter.setAttribute('aria-pressed', String(filter === button));
      }
      loadCases();
    });
    retry.addEventListener('click', loadCases);
    resolution.addEventListener('input', () => {
      updateResolutionCount();
      resolution.removeAttribute('aria-invalid');
      resolveError.hidden = true;
    });
    cancelButton.addEventListener('click', () => dialog.close());
    dialog.addEventListener('cancel', event => { if (saving) event.preventDefault(); });
    dialog.addEventListener('close', () => { pendingCase = null; });
    document.getElementById('resolve-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (saving || !pendingCase) return;
      const count = updateResolutionCount();
      if (count < 1 || count > 300) {
        resolveError.textContent = '请填写 1–300 字的处置说明';
        resolveError.hidden = false;
        resolution.setAttribute('aria-invalid', 'true');
        resolution.focus();
        return;
      }
      const target = { ...pendingCase };
      const text = resolution.value.trim();
      resolveError.hidden = true;
      setSaving(true);
      try {
        const response = await fetch(`/api/faith-cases/${encodeURIComponent(target.id)}/resolve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: target.status, resolution: text }),
        });
        const updated = await readResponse(response);
        cases = cases.map(item => item.id === target.id ? updated : item)
          .filter(item => !selectedStatus || item.status === selectedStatus);
        renderCases();
        summary.textContent = `已标记为${updated.status} · 共 ${cases.length} 个案`;
        dialog.close();
      } catch (error) {
        resolveError.textContent = error instanceof TypeError ? '网络连接失败，请检查网络后重试' : error.message;
        resolveError.hidden = false;
      } finally {
        setSaving(false);
      }
    });
    loadCases();
  </script>
</body>
</html>
