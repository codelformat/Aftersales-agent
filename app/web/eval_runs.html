<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>示例商城 · 评估趋势</title>
  <style>
    :root { color-scheme: light; --primary: #2563eb; --page: #f4f6fa; --surface: #fff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --error: #c62828; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    [hidden] { display: none !important; }
    .ledger { width: min(1200px, calc(100% - 48px)); margin: 28px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 0 40px #1f29370d; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding: 22px 28px; }
    h1 { margin: 0; font-size: 19px; font-weight: 650; }
    h2 { margin: 0; font-size: 14px; font-weight: 650; }
    .subtext { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
    .admin-nav { display: flex; flex-wrap: wrap; gap: 12px; }
    a { color: var(--primary); font-size: 14px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { cursor: pointer; font: inherit; padding: 8px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-size: 14px; }
    button:hover:enabled { background: #f0f2f5; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible, a:focus-visible { outline: 3px solid #93b4ff; outline-offset: 3px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 0 28px 20px; }
    .summary { color: var(--muted); font-size: 13px; }
    .trend-alert, .notice { padding: 16px 28px; margin: 0; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.6; }
    .notice { color: var(--muted); }
    .error, .trend-alert.declining { color: var(--error); }
    .trend-alert.declining { background: #fce8e8; }
    .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 24px 28px; border-top: 1px solid var(--border); }
    .metric { min-width: 0; padding: 16px; border: 1px solid var(--border); border-radius: 12px; color: var(--primary); }
    .metric.declining { color: var(--error); border-color: #e9b7b7; background: #fffafa; }
    .metric-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .metric-value { font-size: 22px; font-weight: 650; }
    .metric svg { display: block; width: 100%; height: auto; margin-top: 12px; overflow: visible; }
    .metric svg text { font-family: inherit; font-size: 10px; fill: var(--muted); }
    @media (max-width: 650px) { .ledger { width: 100%; margin: 0; min-height: 100vh; border: 0; border-radius: 0; } .header { padding: 20px 16px; } .toolbar { padding: 0 16px 16px; } .notice, .trend-alert { padding: 16px; } .charts { grid-template-columns: 1fr; padding: 20px 16px; } }
  </style>
</head>
<body>
  <main class="ledger">
    <header class="header">
      <div><h1>评估趋势</h1><p class="subtext">仅比较与最新一轮题数相同的轮次。误拒率越低越好，其余指标越高越好。</p></div>
      <nav class="admin-nav" aria-label="管理页面">
        <a href="/admin/faith-cases">编造台账</a><a href="/admin/review-queue">待审队列</a><a href="/admin/eval-runs" aria-current="page">评估趋势</a><a href="/">返回聊天</a>
      </nav>
    </header>
    <div class="toolbar"><button id="refresh" type="button">刷新</button><span id="summary" class="summary" role="status"></span></div>
    <p id="trend-alert" class="trend-alert" role="status" hidden></p>
    <p id="notice" class="notice" role="status" hidden></p>
    <div id="charts" class="charts" aria-busy="true" hidden></div>
  </main>
  <script>
    const metrics = [
      ['recall_at_1', 'R@1'], ['recall_at_3', 'R@3'], ['recall_at_5', 'R@5'], ['recall_at_10', 'R@10'],
      ['mrr', 'MRR'], ['faithfulness', '忠实度'], ['false_refusal', '误拒率'], ['d_refusal', 'D 拒答率'],
    ];
    const charts = document.getElementById('charts');
    const summary = document.getElementById('summary');
    const notice = document.getElementById('notice');
    const trendAlert = document.getElementById('trend-alert');
    const refresh = document.getElementById('refresh');
    const svgNS = 'http://www.w3.org/2000/svg';

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function svgElement(tag, attrs, text) {
      const node = document.createElementNS(svgNS, tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function valueOf(run, key) {
      const value = run.metrics?.[key];
      return typeof value === 'number' && Number.isFinite(value) ? value : null;
    }

    function formatTime(value, full = false) {
      return new Date(value).toLocaleString('zh-CN', full ? { hour12: false } :
        { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function metricChart(points, key, label, declining) {
      const card = element('section', declining ? 'metric declining' : 'metric');
      const latestValue = valueOf(points[points.length - 1], key);
      const previousValue = points.length > 1 ? valueOf(points[points.length - 2], key) : null;
      const heading = element('div', 'metric-header');
      heading.append(element('h2', '', label), element('span', 'metric-value', latestValue === null ? '—' : latestValue.toFixed(3)));
      card.append(heading);
      if (previousValue !== null && latestValue !== null) {
        const delta = latestValue - previousValue;
        card.append(element('p', 'subtext', `较上一轮 ${delta > 0 ? '+' : ''}${delta.toFixed(3)}${declining ? ' · 下滑' : ''}`));
      } else card.append(element('p', 'subtext', points.length > 1 ? '缺少指标，无法比较上一轮' : '暂无上一轮'));
      const svg = svgElement('svg', { viewBox: '0 0 480 200', role: 'img', 'aria-label': `${label}随时间变化${declining ? '，最新一轮下滑' : ''}` });
      svg.append(svgElement('title', {}, `${label}趋势`));
      const left = 38, right = 462, top = 12, bottom = 152;
      const times = points.map(point => new Date(point.created_at).getTime());
      const start = times[0], end = times[times.length - 1];
      const x = index => end === start ? (left + right) / 2 : left + (times[index] - start) / (end - start) * (right - left);
      const y = value => bottom - value * (bottom - top);
      for (const tick of [0, .5, 1]) {
        svg.append(svgElement('line', { x1: left, y1: y(tick), x2: right, y2: y(tick), stroke: '#e5e7eb' }),
          svgElement('text', { x: left - 8, y: y(tick) + 3, 'text-anchor': 'end' }, tick.toFixed(1)));
      }
      // 缺失指标断开折线，不将缺失值当成零。
      let path = '', connected = false;
      points.forEach((point, index) => {
        const value = valueOf(point, key);
        if (value === null) { connected = false; return; }
        path += `${connected ? 'L' : 'M'}${x(index).toFixed(2)},${y(value).toFixed(2)} `;
        connected = true;
      });
      if (path) svg.append(svgElement('path', { d: path, fill: 'none', stroke: 'currentColor', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
      points.forEach((point, index) => {
        const value = valueOf(point, key);
        if (value === null) return;
        const dot = svgElement('circle', { cx: x(index), cy: y(value), r: 3.5, fill: 'currentColor' });
        dot.append(svgElement('title', {}, `第 ${point.id} 轮 · ${formatTime(point.created_at, true)} · ${label} ${value.toFixed(3)}`));
        svg.append(dot);
      });
      const tickIndices = [...new Set([0, Math.floor((points.length - 1) / 2), points.length - 1])];
      for (const index of tickIndices) {
        svg.append(svgElement('line', { x1: x(index), y1: bottom, x2: x(index), y2: bottom + 5, stroke: '#9ca3af' }),
          svgElement('text', { x: x(index), y: bottom + 22, 'text-anchor': points.length === 1 ? 'middle' : index === 0 ? 'start' : index === points.length - 1 ? 'end' : 'middle' }, formatTime(points[index].created_at)));
      }
      svg.append(svgElement('text', { x: (left + right) / 2, y: 195, 'text-anchor': 'middle' }, '时间'));
      card.append(svg);
      if (!path) card.append(element('p', 'subtext', '暂无该指标数据'));
      return card;
    }

    function renderRuns(runs) {
      charts.replaceChildren();
      if (!runs.length) {
        summary.textContent = '共 0 轮';
        notice.textContent = '暂无评估轮次';
        notice.hidden = false;
        return;
      }
      const ordered = [...runs].sort((a, b) => new Date(a.created_at) - new Date(b.created_at) || a.id - b.id);
      const latest = ordered[ordered.length - 1];
      const points = ordered.filter(run => run.dataset_size === latest.dataset_size);
      const previous = points.length > 1 ? points[points.length - 2] : null;
      const dropped = metrics.filter(([key]) => {
        const current = valueOf(latest, key), before = previous ? valueOf(previous, key) : null;
        if (current === null || before === null) return false;
        // 排除浮点误差，恰好变化 0.02 不标红。
        const worsening = key === 'false_refusal' ? current - before : before - current;
        return worsening > .02 + 1e-10;
      });
      const droppedKeys = new Set(dropped.map(([key]) => key));
      trendAlert.textContent = '下滑指标：' + (dropped.length ? dropped.map(([, label]) => label).join('、') : '无');
      trendAlert.className = dropped.length ? 'trend-alert declining' : 'trend-alert';
      trendAlert.hidden = false;
      summary.textContent = `数据集 ${latest.dataset_size} 题 · ${points.length} 轮（最近 ${runs.length} 轮中） · 最新 ${formatTime(latest.created_at, true)}`;
      notice.textContent = points.length === 1 ? '至少需要两轮才能看趋势' : '';
      notice.hidden = points.length > 1;
      for (const [key, label] of metrics) charts.append(metricChart(points, key, label, droppedKeys.has(key)));
      charts.hidden = false;
    }

    async function loadRuns() {
      refresh.disabled = true;
      charts.hidden = trendAlert.hidden = true;
      charts.setAttribute('aria-busy', 'true');
      summary.textContent = '正在加载…';
      notice.className = 'notice';
      notice.textContent = '正在加载评估轮次…';
      notice.hidden = false;
      try {
        const response = await fetch('/api/eval-runs?limit=30');
        let body;
        try { body = await response.json(); } catch { /* 无 JSON 时使用 HTTP 状态。 */ }
        if (!response.ok) {
          const detail = body?.detail;
          throw new Error(Array.isArray(detail) ? '输入不合法' : detail?.message || (typeof detail === 'string' ? detail : '') || `请求失败（HTTP ${response.status}）`);
        }
        if (!Array.isArray(body)) throw new Error('评估轮次格式错误');
        renderRuns(body);
      } catch (error) {
        summary.textContent = '加载失败';
        notice.className = 'notice error';
        notice.textContent = error.message;
        notice.hidden = false;
      } finally {
        refresh.disabled = false;
        charts.setAttribute('aria-busy', 'false');
      }
    }
    refresh.addEventListener('click', loadRuns);
    loadRuns();
  </script>
</body>
</html>
