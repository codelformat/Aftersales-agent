<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>示例商城 · 售后客服</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --page: #f4f6fa;
      --surface: #ffffff;
      --assistant: #f0f2f5;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --error: #c62828;
      --on-primary: #ffffff;
      --focus: #93b4ff;
      --shadow: #1f29370d;
      --tool-pending-bg: #e8edf8;
      --tool-pending-text: #46618f;
      --tool-success-bg: #e4f3e8;
      --tool-success-text: #28733e;
      --tool-failure-bg: #fce8e8;
      --tool-failure-text: #b32626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    .chat-layout {
      position: relative;
      display: flex;
      width: min(100%, 1140px);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      background: var(--surface);
      box-shadow: 0 0 40px var(--shadow);
    }
    .chat {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
    }
    .conversation-sidebar {
      display: flex;
      flex-direction: column;
      flex: 0 0 240px;
      width: 240px;
      min-height: 0;
      padding: 16px 12px;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    .sidebar-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    .sidebar-heading h2 { margin: 0; padding-left: 8px; font-size: 16px; }
    .conversation-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px; }
    .conversation-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-bottom: 8px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
    }
    .conversation-item:hover:enabled { background: var(--assistant); }
    .conversation-item.active { border-color: var(--primary); background: var(--assistant); }
    .conversation-preview { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .conversation-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .conversation-summary { padding: 2px 6px; border-radius: 6px; background: var(--tool-pending-bg); color: var(--tool-pending-text); }
    .header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .sidebar-toggle, .sidebar-close { display: none; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 28px;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 19px; font-weight: 650; }
    .new-chat {
      flex-shrink: 0;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }
    .new-chat:hover:enabled { background: var(--assistant); }
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-anchor: none;
      padding: 28px;
    }
    .message { display: flex; min-width: 0; margin-bottom: 20px; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: 75%;
      padding: 13px 17px;
      border-radius: 16px;
      background: var(--assistant);
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user .bubble {
      background: var(--primary);
      color: var(--on-primary);
      border-bottom-right-radius: 5px;
    }
    .assistant .bubble { border-bottom-left-radius: 5px; }
    .message.has-actions { flex-direction: column; align-items: flex-start; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .system-message { margin-bottom: 20px; text-align: center; color: var(--muted); font-size: 13px; }
    .sender { margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .action-fields { display: grid; gap: 8px; margin: 18px 0; }
    .action-fields[hidden] { display: none; }
    .action-fields textarea { width: 100%; }
    .understood { max-width: 100%; margin-bottom: 6px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .order-picker { width: 75%; min-width: 0; margin-top: 10px; }
    .order-prompt { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    .order-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .order-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      overflow-wrap: anywhere;
    }
    .order-card:hover:enabled { border-color: var(--primary); background: var(--tool-pending-bg); }
    .order-card.selected { border-color: var(--primary); background: var(--tool-pending-bg); }
    .ticket-preview { width: 75%; min-width: 0; margin-top: 10px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow-wrap: anywhere; }
    .ticket-line { margin: 0 0 6px; color: var(--text); font-size: 13px; }
    .ticket-buttons { display: flex; gap: 8px; margin-top: 10px; }
    .ticket-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-size: 14px; }
    .ticket-btn:hover:enabled { background: var(--assistant); }
    .ticket-btn.primary { border: 0; padding: 9px 17px; background: var(--primary); color: var(--on-primary); }
    .ticket-btn.primary:hover:enabled { background: var(--primary-hover); }
    .ticket-stale { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .order-title { font-weight: 600; }
    .order-detail { color: var(--muted); font-size: 12px; }
    .order-status { padding: 2px 8px; border-radius: 999px; background: var(--assistant); color: var(--muted); font-size: 12px; }
    .message.order-selection .bubble { padding: 8px 13px; font-size: 13px; }
    .refund-fields select {
      width: 100%;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
    }
    .refund-count { color: var(--muted); font-size: 12px; text-align: right; }
    .citation {
      padding: 0 2px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--primary);
      font-size: .75em;
      line-height: 1;
      vertical-align: super;
    }
    .citation:hover { background: var(--tool-pending-bg); }
    .feedback {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      white-space: normal;
    }
    .feedback button {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
    }
    .feedback button.selected {
      border-color: var(--primary);
      background: var(--tool-pending-bg);
      opacity: 1;
    }
    .feedback-status { color: var(--muted); font-size: 12px; }
    .citation-card {
      width: min(560px, calc(100% - 32px));
      max-height: 80vh;
      max-height: 80dvh;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 12px 40px #1f293726;
      overflow-wrap: anywhere;
    }
    .citation-card::backdrop { background: #1f29374d; }
    .citation-heading { display: flex; align-items: flex-start; gap: 16px; }
    .citation-heading h2 { flex: 1; margin: 0; font-size: 17px; }
    .citation-body { margin: 18px 0; line-height: 1.7; white-space: pre-wrap; }
    .citation-status { color: var(--muted); font-size: 13px; }
    .citation-status.error { color: var(--error); }
    .citation-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .citation-nav button:last-child { margin-left: auto; }
    .citation-nav button[hidden] { display: none; }
    .citation-card:focus-visible { outline: 3px solid var(--focus); }
    .tool-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      white-space: normal;
    }
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--tool-pending-bg);
      color: var(--tool-pending-text);
      font-size: 12px;
      line-height: 1.5;
    }
    .tool-badge.success {
      background: var(--tool-success-bg);
      color: var(--tool-success-text);
    }
    .tool-badge.failure {
      background: var(--tool-failure-bg);
      color: var(--tool-failure-text);
    }
    .tool-icon { flex-shrink: 0; }
    .tool-badge.pending .tool-icon {
      width: 11px;
      height: 11px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .typing { display: flex; align-items: center; gap: 5px; min-height: 27px; }
    .typing[hidden] { display: none; }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse {
      0%, 70%, 100% { opacity: .35; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-3px); }
    }
    .error { color: var(--error); }
    .reply:not(:empty) ~ .error { margin-top: 10px; }
    .composer { padding: 18px 28px 20px; border-top: 1px solid var(--border); }
    .input-row { display: flex; align-items: flex-end; gap: 12px; }
    textarea {
      flex: 1;
      min-width: 0;
      min-height: 76px;
      max-height: 180px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--muted); }
    .send {
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: var(--on-primary);
    }
    .send:hover:enabled { background: var(--primary-hover); }
    .hint { margin: 9px 0 0; color: var(--muted); font-size: 12px; }
    @media (max-width: 719px) {
      .conversation-sidebar { display: none; position: absolute; inset: 0 auto 0 0; z-index: 2; box-shadow: 8px 0 24px var(--shadow); }
      .chat-layout.sidebar-open .conversation-sidebar { display: flex; }
      .sidebar-toggle, .sidebar-close { display: inline-block; }
      .header { gap: 8px; }
      .header-title { gap: 8px; }
      .header-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sidebar-toggle { padding: 8px; }
    }
    @media (max-width: 600px) {
      .header { padding: 18px 16px; }
      h1 { font-size: 16px; }
      .messages { padding: 20px 16px; }
      .bubble { max-width: 85%; }
      .order-picker { width: 100%; }
      .ticket-preview { width: 100%; }
      .order-cards { grid-template-columns: minmax(0, 1fr); }
      .composer { padding: 14px 16px max(14px, env(safe-area-inset-bottom)); }
      .send { padding: 12px 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing span, .tool-badge.pending .tool-icon { animation: none; }
    }
  </style>
</head>
<body>
  <div id="chat-layout" class="chat-layout">
  <aside id="conversation-sidebar" class="conversation-sidebar" aria-labelledby="sidebar-title">
    <div class="sidebar-heading">
      <h2 id="sidebar-title">历史会话</h2>
      <button id="sidebar-close" class="new-chat sidebar-close" type="button" aria-label="收起会话侧栏">关闭</button>
    </div>
    <nav id="conversation-list" class="conversation-list" aria-label="会话列表"></nav>
  </aside>
  <main class="chat">
    <header class="header">
      <div class="header-title">
        <button id="sidebar-toggle" class="new-chat sidebar-toggle" type="button" aria-controls="conversation-sidebar" aria-expanded="false" aria-label="展开会话侧栏">☰</button>
        <h1>示例商城 · 售后客服</h1>
      </div>
      <button id="new-chat" class="new-chat" type="button">新对话</button>
    </header>
    <section id="messages" class="messages" role="log" aria-label="对话消息" aria-live="polite"></section>
    <form id="composer" class="composer">
      <div class="input-row">
        <textarea id="input" rows="2" maxlength="2000" aria-label="输入您的问题" aria-describedby="hint" placeholder="请输入您的问题…"></textarea>
        <button id="send" class="send" type="submit" disabled>发送</button>
      </div>
      <p id="hint" class="hint">Enter 发送 · Shift+Enter 换行 · 最多 2000 字符</p>
    </form>
  </main>
  </div>
  <dialog id="citation-card" class="citation-card" aria-labelledby="citation-title">
    <div class="citation-heading">
      <h2 id="citation-title"></h2>
      <button id="citation-close" class="new-chat" type="button" aria-label="关闭原文卡片">关闭</button>
    </div>
    <div id="citation-body" class="citation-body"></div>
    <div id="citation-status" class="citation-status" role="status"></div>
    <div class="citation-nav">
      <button id="citation-prev" class="new-chat" type="button" hidden>上一段</button>
      <button id="citation-next" class="new-chat" type="button" hidden>下一段</button>
    </div>
  </dialog>
  <dialog id="action-dialog" class="citation-card" aria-labelledby="action-title">
    <form id="action-form">
      <div class="citation-heading">
        <h2 id="action-title"></h2>
      </div>
      <div id="action-fields" class="action-fields" hidden>
        <div>工单类型：<span id="ticket-type"></span></div>
        <label for="ticket-description">描述</label>
        <textarea id="ticket-description" rows="4" maxlength="500" required></textarea>
      </div>
      <div id="refund-fields" class="action-fields refund-fields" hidden>
        <div>订单号：<span id="refund-order"></span></div>
        <label for="refund-reason">退款原因</label>
        <select id="refund-reason" required disabled>
          <option value="">请选择退款原因</option>
          <option>七天无理由</option>
          <option>质量问题</option>
          <option>商品与描述不符</option>
          <option>发错货或漏发</option>
          <option>物流损坏</option>
          <option>其他</option>
        </select>
        <label for="refund-note">备注（可选）</label>
        <textarea id="refund-note" rows="4" maxlength="200" aria-describedby="refund-count" disabled></textarea>
        <div id="refund-count" class="refund-count" aria-live="polite">剩余 200 字</div>
      </div>
      <div id="action-error" class="citation-status error" role="alert"></div>
      <div class="citation-nav">
        <button id="action-cancel" class="new-chat" type="button">取消</button>
        <button id="action-confirm" class="send" type="submit">确认</button>
      </div>
    </form>
  </dialog>
  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendButton = document.getElementById('send');
    const newChatButton = document.getElementById('new-chat');
    const composer = document.getElementById('composer');
    const chatLayout = document.getElementById('chat-layout');
    const conversationList = document.getElementById('conversation-list');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebarClose = document.getElementById('sidebar-close');
    let conversationRequest = 0;
    let historyRequest = 0;
    const welcome = '您好，我是示例商城的售后客服助手。请问有什么可以帮您？';
    let userId = null;
    let sessionId = null;
    let streaming = false;
    let followBottom = true;
    let stopTyping = null;
    let answerIndex = 0;
    const citationCard = document.getElementById('citation-card');
    const citationTitle = document.getElementById('citation-title');
    const citationBody = document.getElementById('citation-body');
    const citationStatus = document.getElementById('citation-status');
    const citationPrev = document.getElementById('citation-prev');
    const citationNext = document.getElementById('citation-next');
    let chunkRequest = 0;
    let currentChunk = null;
    const actionDialog = document.getElementById('action-dialog');
    const actionTitle = document.getElementById('action-title');
    const actionFields = document.getElementById('action-fields');
    const ticketType = document.getElementById('ticket-type');
    const ticketDescription = document.getElementById('ticket-description');
    const refundFields = document.getElementById('refund-fields');
    const refundOrder = document.getElementById('refund-order');
    const refundReason = document.getElementById('refund-reason');
    const refundNote = document.getElementById('refund-note');
    const refundCount = document.getElementById('refund-count');
    const actionError = document.getElementById('action-error');
    const actionCancel = document.getElementById('action-cancel');
    const actionConfirm = document.getElementById('action-confirm');
    let actionContext = null;

    function actionKey(option) {
      return option.type === 'refund' ? `refund:${option.order_id}` : option.type;
    }

    function updateRefundForm() {
      refundCount.textContent = `剩余 ${200 - refundNote.value.length} 字`;
      if (actionContext?.option.type === 'refund') {
        actionConfirm.disabled = actionContext.submitting || !refundReason.value;
      }
    }
    refundReason.addEventListener('change', updateRefundForm);
    refundNote.addEventListener('input', updateRefundForm);

    function addSystemMessage(text) {
      const row = document.createElement('div');
      row.className = 'system-message';
      row.textContent = text;
      messages.append(row);
      scrollToBottom();
    }

    function renderActions(bubble, state, options) {
      if (options !== undefined) {
        state.options = Array.isArray(options) ? options : [];
        if (actionContext?.state === state && !actionContext.submitting) {
          actionContext = null;
          if (actionDialog.open) actionDialog.close();
        }
      }
      if (!state.row) {
        state.row = document.createElement('div');
        state.row.className = 'actions';
        bubble.parentElement.classList.add('has-actions');
        bubble.after(state.row);
      }
      state.row.replaceChildren();
      for (const option of state.options) {
        if (!['handoff', 'ticket', 'refund'].includes(option.type)) continue;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'new-chat';
        const completed = state.completed.has(actionKey(option));
        button.textContent = option.type === 'refund' ? (completed ? '已提交' : '提交退款单') :
          (option.type === 'handoff' ? '转人工' : '建工单');
        button.disabled = completed;
        button.addEventListener('click', () => {
          actionContext = { bubble, state, option, sessionId: state.sessionId, userId: getUserId(), submitting: false };
          const isTicket = option.type === 'ticket';
          const isRefund = option.type === 'refund';
          actionTitle.textContent = isRefund ? '提交退款单' : (isTicket ? '确认创建工单' : '确认转接人工客服吗？');
          actionFields.hidden = !isTicket;
          ticketDescription.disabled = !isTicket;
          ticketType.textContent = isTicket ? option.ticket_type : '';
          ticketDescription.value = isTicket ? (option.description || '').slice(0, 500) : '';
          refundFields.hidden = !isRefund;
          refundReason.disabled = !isRefund;
          refundNote.disabled = !isRefund;
          refundOrder.textContent = isRefund ? option.order_id : '';
          refundReason.value = '';
          refundNote.value = '';
          actionError.textContent = '';
          actionCancel.disabled = false;
          actionConfirm.disabled = false;
          actionConfirm.textContent = isRefund ? '提交' : '确认';
          updateRefundForm();
          actionDialog.showModal();
        });
        state.row.append(button);
      }
      scrollToBottom();
    }

    actionCancel.addEventListener('click', () => actionDialog.close());
    actionDialog.addEventListener('cancel', event => {
      if (actionContext?.submitting) event.preventDefault();
    });
    actionDialog.addEventListener('close', () => { actionContext = null; });
    document.getElementById('action-form').addEventListener('submit', async event => {
      event.preventDefault();
      const context = actionContext;
      if (!context || context.submitting) return;
      const { bubble, state, option } = context;
      const isRefund = option.type === 'refund';
      if (isRefund && !refundReason.value) return;
      if (option.type === 'handoff') {
        addSystemMessage('已转接人工客服');
        const { bubble: humanBubble } = addMessage('assistant', '您好，我是客服小猫，请问有什么可以帮您的');
        const sender = document.createElement('div');
        sender.className = 'sender';
        sender.textContent = '客服小猫';
        humanBubble.prepend(sender);
        state.completed.add('handoff');
        renderActions(bubble, state);
        actionDialog.close();
        return;
      }
      context.submitting = true;
      actionCancel.disabled = true;
      actionConfirm.disabled = true;
      ticketDescription.disabled = true;
      refundReason.disabled = true;
      refundNote.disabled = true;
      actionError.textContent = '';
      const failureMessage = isRefund ? '退款申请提交失败，请稍后重试' : '工单创建失败，请稍后重试';
      try {
        const payload = { session_id: context.sessionId, user_id: context.userId };
        if (isRefund) {
          payload.order_id = option.order_id;
          payload.reason = refundReason.value;
          if (refundNote.value.trim()) payload.note = refundNote.value.trim();
        } else {
          payload.description = ticketDescription.value;
          payload.ticket_type = option.ticket_type;
        }
        const response = await fetch(isRefund ? '/refunds' : '/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(response.status === 409 ? '当前正在回复中，请稍后再试' :
            (typeof body.detail?.message === 'string' && body.detail.message ?
              body.detail.message : (typeof body.detail === 'string' ? body.detail : failureMessage)));
        }
        state.completed.add(actionKey(option));
        if (bubble.isConnected) {
          if (isRefund) {
            addMessage('assistant', `已为您提交退款申请 ${body.refund_no}，状态：待审核。`);
          } else {
            addSystemMessage(`工单已创建：${body.ticket_no}`);
          }
          renderActions(bubble, state);
        }
        if (actionContext === context) actionDialog.close();
      } catch (error) {
        if (actionContext === context && !state.options.includes(option)) {
          actionContext = null;
          actionDialog.close();
        } else if (actionContext === context) {
          actionError.textContent = error instanceof TypeError ? failureMessage :
            (error.message || failureMessage);
        }
      } finally {
        context.submitting = false;
        if (actionContext === context) {
          actionCancel.disabled = false;
          actionConfirm.disabled = false;
          ticketDescription.disabled = isRefund;
          refundReason.disabled = !isRefund;
          refundNote.disabled = !isRefund;
          updateRefundForm();
        }
      }
    });

    function showCitationContent(item) {
      citationTitle.textContent = item.section_path || '知识库原文';
      citationBody.textContent = `问：${item.question ?? item.questions ?? ''}\n答：${item.answer ?? ''}`;
    }

    async function loadChunk(id) {
      const request = ++chunkRequest;
      currentChunk = null;
      citationPrev.hidden = true;
      citationNext.hidden = true;
      citationStatus.className = 'citation-status';
      citationStatus.textContent = '正在加载原文…';
      try {
        const response = await fetch(`/api/knowledge/chunks/${encodeURIComponent(id)}`);
        if (!response.ok) throw new Error('原文加载失败');
        const chunk = await response.json();
        if (request !== chunkRequest || !citationCard.open) return;
        currentChunk = chunk;
        showCitationContent(chunk);
        citationPrev.hidden = chunk.prev_chunk_id == null;
        citationNext.hidden = chunk.next_chunk_id == null;
        citationStatus.textContent = '';
      } catch {
        if (request !== chunkRequest || !citationCard.open) return;
        citationStatus.className = 'citation-status error';
        citationStatus.textContent = '原文加载失败';
      }
    }

    function openCitation(item) {
      showCitationContent(item);
      if (!citationCard.open) citationCard.showModal();
      loadChunk(item.chunk_id);
    }

    document.getElementById('citation-close').addEventListener('click', () => citationCard.close());
    citationCard.addEventListener('close', () => { chunkRequest++; currentChunk = null; });
    citationCard.addEventListener('click', event => {
      if (event.target !== citationCard) return;
      const bounds = citationCard.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right ||
          event.clientY < bounds.top || event.clientY > bounds.bottom) citationCard.close();
    });
    citationPrev.addEventListener('click', () => {
      if (currentChunk?.prev_chunk_id != null) loadChunk(currentChunk.prev_chunk_id);
    });
    citationNext.addEventListener('click', () => {
      if (currentChunk?.next_chunk_id != null) loadChunk(currentChunk.next_chunk_id);
    });

    function renderReply(reply, text, citations) {
      const items = new Map(citations.items.map(item => [item.n, item]));
      const fragment = document.createDocumentFragment();
      let offset = 0;
      for (const match of text.matchAll(/\[(\d+)\]/g)) {
        fragment.append(document.createTextNode(text.slice(offset, match.index)));
        const item = items.get(Number(match[1]));
        if (item) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'citation';
          button.textContent = match[0];
          button.setAttribute('aria-label', `查看引用 ${item.n} 的原文`);
          button.addEventListener('click', () => openCitation(item));
          fragment.append(button);
        } else {
          fragment.append(document.createTextNode(match[0]));
        }
        offset = match.index + match[0].length;
      }
      fragment.append(document.createTextNode(text.slice(offset)));
      reply.replaceChildren(fragment);
    }

    function addFeedback(bubble, answer) {
      const row = document.createElement('div');
      row.className = 'feedback';
      const status = document.createElement('span');
      status.className = 'feedback-status';
      status.setAttribute('role', 'status');
      const buttons = [];
      for (const [rating, icon, label] of [['up', '👍', '有帮助'], ['down', '👎', '没有帮助']]) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = icon;
        button.setAttribute('aria-label', label);
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', async () => {
          buttons.forEach(item => { item.disabled = true; });
          status.textContent = '提交中…';
          try {
            const response = await fetch('/api/feedback', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ conversation_id: Number(answer.sessionId),
                message_id: answer.messageId, rating, user_id: answer.userId }),
            });
            if (!response.ok) throw new Error('反馈失败');
          } catch {
            status.textContent = '反馈失败';
            buttons.forEach(item => { item.disabled = false; });
            return;
          }
          button.classList.add('selected');
          button.setAttribute('aria-pressed', 'true');
          status.textContent = rating === 'down' ? '已反馈，我们会改进' : '已反馈';
          try {
            const stored = JSON.parse(localStorage.getItem('aftersales_feedback') || '[]');
            const records = Array.isArray(stored) ? stored : [];
            records.push({ session_id: answer.sessionId, answer_index: answer.index,
              rating, at: new Date().toISOString() });
            localStorage.setItem('aftersales_feedback', JSON.stringify(records));
          } catch { /* Feedback still works when storage is unavailable. */ }
        });
        buttons.push(button);
        row.append(button);
      }
      row.append(status);
      bubble.append(row);
      scrollToBottom();
    }

    function getUserId() {
      if (userId) return userId;
      try {
        const stored = localStorage.getItem('aftersales_user_id');
        if (/^web-[a-f0-9]{16}$/.test(stored)) {
          userId = stored;
          return userId;
        }
      } catch { /* Storage may be unavailable; keep the ID in memory. */ }
      const bytes = crypto.getRandomValues(new Uint8Array(8));
      userId = 'web-' + Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
      try {
        localStorage.setItem('aftersales_user_id', userId);
      } catch { /* Subsequent requests reuse the in-memory ID. */ }
      return userId;
    }

    function setSidebarOpen(open) {
      chatLayout.classList.toggle('sidebar-open', open);
      sidebarToggle.setAttribute('aria-expanded', String(open));
      sidebarToggle.setAttribute('aria-label', open ? '收起会话侧栏' : '展开会话侧栏');

    sidebarToggle.addEventListener('click', () => {

    sidebarClose.addEventListener('click', () => {

    function updateConversationSelection() {
      for (const item of conversationList.children) {

    function formatConversationTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      const pad = number => String(number).padStart(2, '0');
      return `${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    async function loadConversations() {
      const request = ++conversationRequest;
      updateConversationSelection();
      try {
        const response = await fetch(`/api/conversations?user_id=${encodeURIComponent(getUserId())}`);
        if (response.status !== 200) throw new Error(`HTTP ${response.status}`);
        const conversations = await response.json();
        if (!Array.isArray(conversations)) throw new Error('会话列表格式错误');
        if (request !== conversationRequest) return;
        const items = document.createDocumentFragment();
        for (const conversation of conversations) {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'conversation-item';
          item.dataset.sessionId = conversation.session_id;
          const preview = document.createElement('span');
          preview.className = 'conversation-preview';
          preview.textContent = conversation.preview || '新会话';
          const meta = document.createElement('span');
          meta.className = 'conversation-meta';
          const time = document.createElement('time');
          time.dateTime = conversation.updated_at;
          time.textContent = formatConversationTime(conversation.updated_at);
          meta.append(time);
          if (conversation.summarized) {
            const summary = document.createElement('span');
            summary.className = 'conversation-summary';
            summary.textContent = '已摘要';
            meta.append(summary);
          }
          item.append(preview, meta);
          item.addEventListener('click', () => loadConversation(conversation.session_id));
          items.append(item);
        }
        conversationList.replaceChildren(items);
        updateConversationSelection();
      } catch (error) {
        console.warn('加载会话列表失败', error);
      }
    }

    async function loadConversation(id) {
      if (streaming) return;
      const request = ++historyRequest;
      try {
        const response = await fetch(`/api/conversations/${encodeURIComponent(id)}/messages?user_id=${encodeURIComponent(getUserId())}`);
        if (response.status !== 200) throw new Error(`HTTP ${response.status}`);
        const history = await response.json();
        if (!Array.isArray(history) || history.some(message =>
          !['user', 'assistant'].includes(message.role) || typeof message.content !== 'string')) {
          throw new Error('会话消息格式错误');
        }
        // Ignore old responses after another selection, a new chat, or a sent message.
        if (request !== historyRequest || streaming) return;
        if (citationCard.open) citationCard.close();
        if (actionDialog.open) actionDialog.close();
        actionContext = null;
        messages.replaceChildren();
        followBottom = true;
        for (const message of history) addMessage(message.role, message.content);
        sessionId = id;
        answerIndex = history.filter(message => message.role === 'assistant').length;
        updateControls();
        setSidebarOpen(false);
        input.focus();
      } catch (error) {
        console.warn('加载会话消息失败', error);
      }
    }

    const toolNames = new Map([
      ['query_order', '查订单'],
      ['query_product', '查商品'],
      ['query_logistics', '查物流'],
      ['query_faq', '查常见问题'],
      ['create_ticket', '创建工单'],
      ['offer_human_options', '推荐人工选项'],
    ]);

    messages.addEventListener('scroll', () => {
      followBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight <= 80;
    });

    function scrollToBottom() {

    function addMessage(role, text = '') {

      bubble.className = 'bubble';

      bubble.append(reply);
      row.append(bubble);

    function updateControls() {
      if (streaming) historyRequest++;
      updateConversationSelection();
      input.disabled = streaming;
      sendButton.disabled = streaming || !input.value.trim();
      newChatButton.disabled = streaming;
      for (const card of messages.querySelectorAll('.order-card')) {
        card.disabled = streaming || card.parentElement.dataset.locked === 'true';
      }
      // 工单确认按钮：流式期间或已点击后保持禁用。

    function renderOrderPicker(bubble, orders, pickerSessionId) {
      const picker = document.createElement('div');
      picker.className = 'order-picker';
      const prompt = document.createElement('p');
      prompt.className = 'order-prompt';
      prompt.textContent = '请选择要办理的订单';
      const cards = document.createElement('div');
      cards.className = 'order-cards';
      const pickerUserId = getUserId();
      for (const order of Array.isArray(orders) ? orders : []) {

          ['order-title', order.title],

        ]) {

          }, message);
        });

      picker.append(prompt, cards);

    // 工单确认卡片：两个按钮点击后立即锁定，再用 /chat/resume 恢复。
    function renderTicketPreview(bubble, data, previewSessionId) {
      const card = document.createElement('div');
      card.className = 'ticket-preview';
      const prompt = document.createElement('p');
      prompt.className = 'order-prompt';
      prompt.textContent = '请确认工单信息';
      const typeLine = document.createElement('p');
      typeLine.className = 'ticket-line';
      typeLine.textContent = `工单类型：${data.ticket_type ?? ''}`;
      const descLine = document.createElement('p');
      descLine.className = 'ticket-line';
      descLine.textContent = `问题描述：${data.description ?? ''}`;
      const buttons = document.createElement('div');
      buttons.className = 'ticket-buttons';
      const previewUserId = getUserId();
      const confirmButton = document.createElement('button');
      const cancelButton = document.createElement('button');
      for (const [button, label] of [[confirmButton, '确认提交'], [cancelButton, '取消']]) {
        button.type = 'button';
        button.className = button === confirmButton ? 'ticket-btn primary' : 'ticket-btn';
        button.textContent = label;
        button.disabled = streaming;
        buttons.append(button);
      }
      function submit(confirmed) {
        if (streaming || buttons.dataset.locked === 'true') return;
        buttons.dataset.locked = 'true';
        confirmButton.disabled = true;
        cancelButton.disabled = true;
        streamReply('/chat/resume', {
          session_id: previewSessionId, user_id: previewUserId, ticket_confirm: confirmed,
        }, confirmed ? '确认提交' : '取消', {
          onStale() {
            const stale = document.createElement('p');
            stale.className = 'ticket-stale';
            stale.textContent = '该工单已失效，请重新发起';
            card.append(stale);
            scrollToBottom();
          },
        });
      }
      confirmButton.addEventListener('click', () => submit(true));
      cancelButton.addEventListener('click', () => submit(false));
      card.append(prompt, typeLine, descLine, buttons);
      bubble.parentElement.classList.add('has-actions');
      bubble.after(card);
      scrollToBottom();
    }

    function resetChat() {
      if (streaming && !stopTyping) return;
      if (stopTyping) stopTyping();
      historyRequest++;
      sessionId = null;
      answerIndex = 0;
      if (citationCard.open) citationCard.close();
      if (actionDialog.open) actionDialog.close();
      actionContext = null;
      messages.replaceChildren();
      followBottom = true;
      addMessage('assistant', welcome);
      input.value = '';
      updateControls();
      setSidebarOpen(false);
      input.focus();
    }

    // Only complete events are passed here; a chunk can end in any line.
    function parseEvent(block) {
      let event = '';
      const data = [];
      for (const line of block.split(/\r?\n/)) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
      }
      if (!data.length) return null; // Ignore SSE comments / keep-alives.
      return { event, data: JSON.parse(data.join('\n')) };
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (streaming || !message) return;
      input.value = '';
      addMessage('user', message);
      const payload = { user_id: getUserId(), message };
      if (sessionId) payload.session_id = sessionId;
      await streamReply('/chat/stream', payload, message);
    }

    async function streamReply(endpoint, payload, originalInput, hooks = {}) {
      streaming = true;
      updateControls();
      const { bubble, reply } = addMessage('assistant');
      const actions = { row: null, options: [], completed: new Set(), sessionId: payload.session_id ?? sessionId };
      // Count submitted assistant turns from zero; the welcome message is excluded.
      const answer = { index: answerIndex++, sessionId: actions.sessionId, userId: payload.user_id,
        text: '', citations: { items: [], refused: false } };
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.setAttribute('role', 'status');
      typing.setAttribute('aria-label', '正在输入');
      for (let i = 0; i < 3; i++) typing.append(document.createElement('span'));
      bubble.append(typing);
      scrollToBottom();

      const toolBadges = new Map();
      let badgeRow = null;
      let queue = [];
      let queueIndex = 0;
      let animation = null;
      let reader = null;
      let terminal = false;
      let streamEnded = false;
      let understoodHint = null;

      function finishTurn() {
        typing.hidden = true;
        const hasContent = Array.from(bubble.children).some(child =>
          child !== typing && !child.classList.contains('feedback') && child.textContent.trim());
        if (!hasContent) {
          bubble.hidden = true;
          if (bubble.parentElement.children.length === 1) bubble.parentElement.remove();
        }
        stopTyping = null;
        streaming = false;
        updateControls();
        input.focus();
      }

      function appendText(text) {
        answer.text += text;
        renderReply(reply, answer.text, answer.citations);
        scrollToBottom();
      }

      function flushQueue() {
        clearInterval(animation);
        animation = null;
        if (queueIndex < queue.length) appendText(queue.slice(queueIndex).join(''));
        queue = [];
        queueIndex = 0;
      }

      function enqueue(text) {
        if (!text) return;
        queue.push(...Array.from(text));
        if (animation !== null) return;
        animation = setInterval(() => {
          const count = Math.max(2, Math.ceil((queue.length - queueIndex) / 60));
          appendText(queue.slice(queueIndex, queueIndex + count).join(''));
          queueIndex += count;
          if (queueIndex >= queue.length) {
            clearInterval(animation);
            animation = null;
            queue = [];
            queueIndex = 0;
            if (streamEnded) finishTurn();
          }
        }, 20);
      }

      function showError(message) {
        flushQueue();
        typing.hidden = true;
        const error = document.createElement('div');
        error.className = 'error';
        error.setAttribute('role', 'alert');
        error.textContent = message;
        bubble.append(error);
        scrollToBottom();
      }

      function startTools(tools) {
        if (!badgeRow && tools.length) {
          badgeRow = document.createElement('div');
          badgeRow.className = 'tool-badges';
          bubble.insertBefore(badgeRow, reply);
        }
        for (const tool of tools) {
          const badge = document.createElement('span');
          badge.className = 'tool-badge pending';
          const icon = document.createElement('span');
          icon.className = 'tool-icon';
          icon.setAttribute('aria-hidden', 'true');
          const label = document.createElement('span');
          const args = tool.args || {};
          const parameter = tool.name === 'create_ticket' ? args.ticket_type :
            (args.order_id ?? args.product_id ?? args.keyword);
          const name = toolNames.get(tool.name) || tool.name;
          label.textContent = parameter !== undefined && parameter !== null && parameter !== '' ?
            `${name} · ${parameter}` : name;
          badge.setAttribute('aria-label', `${label.textContent}，进行中`);
          badge.append(icon, label);
          badgeRow.append(badge);
          toolBadges.set(tool.id, { badge, icon, label });
        }
        typing.replaceChildren(document.createTextNode('正在查询…'));
        typing.setAttribute('aria-label', '正在查询');
        scrollToBottom();
      }

      function endTools(tools) {
        for (const tool of tools) {
          const elements = toolBadges.get(tool.id);
          if (!elements) continue;
          const { badge, icon, label } = elements;
          const ok = tool.ok === true;
          badge.className = `tool-badge ${ok ? 'success' : 'failure'}`;
          icon.textContent = ok ? '✓' : '✗';
          badge.setAttribute('aria-label', `${label.textContent}，${ok ? '已完成' : '查询失败'}`);
          if (!ok) badge.title = '查询失败';
        }
        scrollToBottom();
      }

      function handleEvent(block) {
        const parsed = parseEvent(block);
        if (!parsed) return;
        const { event, data } = parsed;
        if (event === 'session') {
          sessionId = data.session_id;
          answer.sessionId = sessionId;
          actions.sessionId = sessionId;
          loadConversations();
        } else if (event === 'understood') {
          if (understoodHint) understoodHint.remove();
          understoodHint = null;
          if (data.resolved_input && data.resolved_input !== originalInput) {
            understoodHint = document.createElement('div');
            understoodHint.className = 'understood';
            understoodHint.textContent = `已理解为：${data.resolved_input}${data.intent == null ? '' : `（${data.intent}）`}`;
            bubble.parentElement.classList.add('has-actions');
            bubble.before(understoodHint);
            scrollToBottom();
          }
        } else if (event === 'order_picker') {
          typing.hidden = true;
          renderOrderPicker(bubble, data.orders, answer.sessionId);
        } else if (event === 'ticket_preview') {
          typing.hidden = true;
          renderTicketPreview(bubble, data, answer.sessionId);
        } else if (event === 'token') {
          typing.hidden = true;
          enqueue(data.text);
        } else if (event === 'tool_start') {
          startTools(data.tools);
        } else if (event === 'tool_end') {
          endTools(data.tools);
        } else if (event === 'actions') {
          renderActions(bubble, actions, data.options);
        } else if (event === 'citations') {
          answer.citations = { items: Array.isArray(data.items) ? data.items : [], refused: data.refused === true };
          renderReply(reply, answer.text, answer.citations);
          scrollToBottom();
        } else if (event === 'done') {
          terminal = true;
          if (data.finish_reason === 'interrupted') {
            flushQueue();
            typing.hidden = true;
          } else if (data.message_id != null) {
            answer.messageId = data.message_id;
            addFeedback(bubble, answer);
          }
          loadConversations();
        } else if (event === 'error') {
          showError(data.message || '服务暂时不可用，请稍后重试');
          terminal = true;
        }
      }

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          if (endpoint === '/chat/resume' && payload.ticket_confirm !== undefined && response.status === 409) {
            hooks.onStale?.(); // 工单确认已失效，提示放在卡片下方。
            return;
          }
          if (endpoint === '/chat/resume' && (response.status === 409 || response.status === 422)) {
            throw new Error('订单选择已失效，请重新提问');
          }
          let errorMessage = `请求失败（HTTP ${response.status}）`;
          try {
            const body = await response.json();
            if (response.status === 404 && body.detail?.code === 'conversation_not_found') {
              sessionId = null;
              errorMessage = '会话已失效，已为您开始新对话，请重新发送。';
            } else if (typeof body.detail?.message === 'string' && body.detail.message) {
              errorMessage = body.detail.message;
            }
          } catch { /* Non-JSON errors use the HTTP status fallback. */ }
          throw new Error(errorMessage);
        }
        if (!response.body) throw new Error('无法读取回复，请稍后重试');
        reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (!terminal) {
          const { value, done } = await reader.read();
          buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });
          let boundary;
          while (!terminal && (boundary = /\r?\n\r?\n/.exec(buffer))) {
            const block = buffer.slice(0, boundary.index);
            buffer = buffer.slice(boundary.index + boundary[0].length);
            handleEvent(block);
          }
          if (done) {
            if (!terminal) throw new Error('连接已中断，请稍后重试');
            break;
          }
        }
      } catch (error) {
        showError(error instanceof TypeError ? '网络连接失败，请检查网络后重试' :
          (error.message || '请求失败，请稍后重试'));
      } finally {
        if (reader) {
          try { await reader.cancel(); } catch { /* The stream may already be closed. */ }
          reader.releaseLock();
        }
        streamEnded = true;
        if (animation === null) {
          finishTurn();
        } else {
          stopTyping = () => {
            flushQueue();
            finishTurn();
          };
        }
      }
    }

    composer.addEventListener('submit', (event) => {
      event.preventDefault();
      sendMessage();
    });
    input.addEventListener('input', updateControls);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
        event.preventDefault();
        if (!streaming) sendMessage();
      }
    });
    newChatButton.addEventListener('click', resetChat);
    getUserId();
    resetChat();
    loadConversations();
  </script>
</body>
</html>
