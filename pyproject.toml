[project]
name = "aftersales-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.15",
    "cryptography>=50.0.2",
    "fastapi>=0.142",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain-core>=1.6",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=1.24,<2",
    "pydantic-settings>=2.15",
    "pymilvus>=3.0.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
