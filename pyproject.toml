[project]
name = "aftersales-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "pydantic-settings>=2.15",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
